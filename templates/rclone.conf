{% if restic_protocol == 'swift' %}

[swift]
type = swift
env_auth = true

{% if restic_rclone_remotes | default(False) %}
{% for r in restic_rclone_remotes %}
{% if r.type != "swift"  %}{{ only_swift_remote_supported }}{% endif %}
[{{ r.region_name }}]
type = swift
env_auth = false
user = {{ r.user }}
key = {{ r.password }}
auth = {{ r.auth_url }}
domain = {{ r.user_domain_name | default('Default') }}
tenant = {{ r.tenant_name }}
tenant_id = {{ r.tenant_id }}
tenant_domain = {{ r.project_domain_name | default('Default') }}
region = {{ r.region_name | quote }}
auth_version = 3
storage_policy = pcs
{% endfor %}
{% endif %}

{% endif %}

{% if restic_protocol == 's3' %}

[s3]
type = s3
env_auth = true

{% if restic_rclone_remotes | default(False) %}
{% for r in restic_rclone_remotes %}
{% if r.type != "s3" %}{{ only_s3_remote_supported }}{% endif %}
[{{ r.region_name }}]
type = s3
provider= Other
env_auth = false
access_key_id={{ r.access_key_id }}
secret_access_key={{ r.secret_access_key }}
region = {{ r.region_name | quote }}
endpoint={{ r.endpoint }}
{% endfor %}
{% endif %}

{% endif %}
